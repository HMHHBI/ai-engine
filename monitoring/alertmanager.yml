route:
  receiver: default
  group_by:
    - alertname
    - team
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      continue: false

receivers:
  - name: default
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/default-webhook-url
        send_resolved: true

  - name: critical
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/critical-webhook-url
        send_resolved: true
