name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hassan_ai_test
        options: >-
          --health-cmd "pg_isready -U postgres -d hassan_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hassan_ai_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hassan_ai_test
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:3000
          ALLOWED_ORIGINS: http://localhost:3000
          SECRET_KEY: ci-test-secret-key
          CLOUDINARY_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hassan_ai_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hassan_ai_test
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:3000
          ALLOWED_ORIGINS: http://localhost:3000
          SECRET_KEY: ci-test-secret-key
          CLOUDINARY_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
        run: pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Production build
        run: npm run build